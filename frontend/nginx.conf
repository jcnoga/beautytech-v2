server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  gzip on;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;
  # Uploads dos tenants: volume da VPS (montado em /srv/uploads, so leitura), gravado pela API.
  # ^~ para nao cair na regra de extensao abaixo.
  location ^~ /uploads/ {
    alias /srv/uploads/;
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'none'; img-src 'self'" always;
  }
  # Arquivos que controlam a atualização do app (PWA): o navegador confere a cada visita. Vem antes da regra de
  # extensão abaixo (entre regex, vale a primeira que casar). add_header numa location não herda os do server,
  # por isso os cabeçalhos de segurança se repetem aqui e na location /.
  location ~* ^/(sw\.js|registerSW\.js|manifest\.webmanifest)$ {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff";
    try_files $uri =404;
  }
  # Arquivos com nome versionado (/assets/*-hash.js, imagens): podem ficar 1 ano no navegador.
  location ~* \.(js|css|png|jpg|ico|svg|woff2)$ { expires 1y; add_header Cache-Control "public, immutable"; }
  # Páginas (index.html): sempre conferidas, para cada deploy chegar na próxima visita.
  location / {
    add_header Cache-Control "no-cache";
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    try_files $uri $uri/ /index.html;
  }
  add_header X-Frame-Options "SAMEORIGIN";
  add_header X-Content-Type-Options "nosniff";
}
