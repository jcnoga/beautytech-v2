server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  gzip on;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;
  # Uploads dos tenants: volume da VPS (montado em /srv/uploads, so leitura), gravado pela API.
  # ^~ para nao cair na regra de extensao abaixo.
  location ^~ /uploads/ {
    alias /srv/uploads/;
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'none'; img-src 'self'" always;
  }
  location ~* \.(js|css|png|jpg|ico|svg|woff2)$ { expires 1y; add_header Cache-Control "public, immutable"; }
  location / { try_files $uri $uri/ /index.html; }
  add_header X-Frame-Options "SAMEORIGIN";
  add_header X-Content-Type-Options "nosniff";
}
